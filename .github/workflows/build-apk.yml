name: Build & Release APK

# Publishes a tester APK to GitHub Releases on master merges (and manual runs).
# In-app updates require a higher versionCode and the asset name:
#   DailyDash-{versionName}-vc{versionCode}.apk
#
# Speed notes (measured ~7m warm runs):
# - ubuntu-latest already ships ANDROID_HOME + platforms (android-36) + build-tools.
#   Skip android-actions/setup-android and Actions SDK caches (restore alone was ~65s;
#   cold cache upload was ~4m and bought nothing over the preinstalled SDK).
# - Mirror nowinandroid / CatchUp: checkout → JDK → setup-gradle → assembleRelease.
# - Disable Gradle home cache cleanup (~30s post step) for this small single-module app.

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      release_notes:
        description: "Optional release notes shown in-app and on GitHub."
        required: false

permissions:
  contents: write

# Serialize master releases so version-bump commits cannot race (Actions #92).
concurrency:
  group: dailydash-apk-release
  cancel-in-progress: false

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8"

jobs:
  release:
    name: Build and publish DailyDash APK
    runs-on: ubuntu-latest
    # Skip the follow-up commit that only bumps versionCode/versionName.
    if: >
      github.event_name != 'push' ||
      !contains(github.event.head_commit.message, '[skip ci]')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so package-release.sh can turn commit subjects since the
          # previous v* tag into What's New bullets (shallow clones were falling
          # back to "Stability and polish improvements").
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}
          # Cleanup is ~30s/run and not worth it for a single-module app.
          cache-cleanup: never

      - name: Ensure unique version
        id: version
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/ensure-unique-version.sh

      # Bake API keys into BuildConfig (same as local.properties on a dev machine).
      # Twitch Connect needs TWITCH_CLIENT_ID (+ SECRET for confidential apps / search).
      # GitHub Connect needs GH_OAUTH_CLIENT_ID (OAuth App Client ID — Device Flow, no secret).
      # Actions forbids secret names starting with GITHUB_, so the repo secret is
      # GH_OAUTH_CLIENT_ID and we write it as GITHUB_CLIENT_ID in local.properties.
      # YouTube Connect Google does NOT use these keys — it uses package com.macrotracker
      # + app/tester.jks SHA-1 registered in Google Cloud Console.
      - name: Write local.properties for BuildConfig keys
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.GH_OAUTH_CLIENT_ID }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${TWITCH_CLIENT_ID:-}" ]; then
            echo "::warning::TWITCH_CLIENT_ID secret is empty — Twitch Connect will fail in this APK"
          fi
          if [ -z "${GITHUB_CLIENT_ID:-}" ]; then
            echo "::warning::GH_OAUTH_CLIENT_ID secret is empty — GitHub Connect will fail in this APK"
          fi
          {
            echo "sdk.dir=${ANDROID_HOME}"
            echo "TWITCH_CLIENT_ID=${TWITCH_CLIENT_ID:-}"
            echo "TWITCH_CLIENT_SECRET=${TWITCH_CLIENT_SECRET:-}"
            echo "GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}"
            echo "YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-}"
            echo "GEMINI_API_KEY=${GEMINI_API_KEY:-}"
            echo "OPENAI_API_KEY=${OPENAI_API_KEY:-}"
            echo "OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}"
            echo "ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}"
          } > local.properties

      - name: Build release APK
        run: ./gradlew assembleRelease --build-cache

      - name: Package release
        id: package
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          COMMIT_SHA: ${{ steps.version.outputs.commit_sha || github.sha }}
          INPUT_NOTES: ${{ github.event.inputs.release_notes }}
          # First-line subject of the push that triggered CI — used if tag-range
          # history is empty (e.g. bump-only follow-up).
          TRIGGER_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/package-release.sh

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.tag }}
          name: ${{ steps.package.outputs.name }}
          body: ${{ steps.package.outputs.notes }}
          # The APK plus its Baseline Profile .dm files (see package-release.sh).
          files: ${{ steps.package.outputs.files }}
          # Notes are composed in package-release.sh (precise bullets + working links).
          generate_release_notes: false
          target_commitish: ${{ steps.version.outputs.commit_sha || github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
